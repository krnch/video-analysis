[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "video-analysis-clipper"
version = "1.0.0"
description = "Bounded local FFmpeg video clipping"
requires-python = ">=3.9"

[project.scripts]
video-clipper = "video_clipper:main"

[tool.setuptools]
py-modules = ["video_clipper", "mock_consumer"]
